[project]
name = "facebook-pages-mcp-server"
version = "1.0.0"
description = "MCP server that lets AI agents work with Facebook Pages through the Graph API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prime Time IT" }]
keywords = ["mcp", "facebook", "graph-api", "pages", "social-media", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# mcp 2.x provides MCPServer and the streamable-HTTP transport. httpx and
# starlette are imported directly, so they are declared even though the MCP
# SDK also depends on HTTP libraries.
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
facebook-pages-mcp-server = "facebook_pages_mcp_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["facebook_pages_mcp_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
